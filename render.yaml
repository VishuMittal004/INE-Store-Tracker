services:
  - type: web
    name: ine-tracker-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false


